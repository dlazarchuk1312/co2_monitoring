<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CO2 Monitoring System{% endblock %}</title>
    <!-- include bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-nav .nav-link:hover {
            color: #fff !important;
        }
        .navbar-nav .nav-link.active {
            color: #fff !important;
            font-weight: 600;
            border-bottom: 2px solid #fff;
        }
    </style>
</head>
<body class="bg-light">

    <!-- navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}">CO2 Monitoring</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-secondary {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary {% if request.resolver_match.url_name == 'enterprises' %}active{% endif %}" href="{% url 'enterprises' %}">Enterprises</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary {% if request.resolver_match.url_name == 'mqtt' %}active{% endif %}" href="{% url 'mqtt' %}">MQTT</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary {% if request.resolver_match.url_name == 'forecasting' %}active{% endif %}" href="{% url 'forecasting' %}">Forecasting</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- main content container -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
